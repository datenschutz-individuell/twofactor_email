# Dependabot is configured for the default branch only, so release/3.3 has no
# dependency watching. This reports rather than repairs: a failing workflow
# reaches the maintainer by mail and needs no token with write access.
#
# Findings that REVIEW.md accepts are listed per branch below, each with its
# severity. The job fails on any other finding, on a changed severity, and on a
# listed one that is gone, so that the list and REVIEW.md are cleaned up together.

name: npm audit

on:
  workflow_dispatch:
  schedule:
    # Mondays, early. An off-minute on purpose, see the other schedules.
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            allowed: &accepted GHSA-3g3m-2fjr-6pw4:moderate GHSA-848j-6mx2-7j84:low GHSA-g3hv-75wg-m249:moderate
          - branch: release/3.3
            allowed: *accepted

    name: npm audit (${{ matrix.branch }})

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Read node and npm versions from package.json
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^11'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      # The version comes from a file rather than from this workflow, so it reaches
      # the shell as data. REVIEW.md says why the pull request workflows differ.
      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        env:
          NPM_VERSION: ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g "npm@$NPM_VERSION"

      # The lock file is what a release ships, and needs no install to be judged.
      # The list lives here, not in the audited branch: the scheduled run uses
      # the default branch's workflow for both branches. An advisory without a
      # GHSA ID is keyed by its URL, so it can never match the list.
      - name: Audit
        env:
          ALLOWED: ${{ matrix.allowed }}
        run: |
          export LC_ALL=C
          npm audit --package-lock-only --json > audit.json || true
          jq -e '.vulnerabilities | type == "object"' audit.json > /dev/null
          jq -r '.vulnerabilities[].via[] | objects | "\(.severity)\t\(.name)\t\(.title)\t\(.url)"' audit.json | sort -u
          jq -r '.vulnerabilities[].via[] | objects | "\((.url | capture("(?<id>GHSA-[0-9a-z-]+)").id) // .url):\(.severity)"' audit.json | sort -u > found
          tr ' ' '\n' <<< "$ALLOWED" | sort -u > allowed
          new=$(comm -23 found allowed | paste -sd ' ')
          gone=$(comm -13 found allowed | paste -sd ' ')
          [ -z "$new" ] || echo "::error::New or changed findings: $new"
          [ -z "$gone" ] || echo "::error::Listed but no longer found, remove from this workflow and REVIEW.md: $gone"
          [ -z "$new$gone" ]
