# Runs the smoke test against every Nextcloud version the app declares support for.
# The version list comes from appinfo/info.xml, so it cannot drift from what info.xml
# claims. Roughly 5 minutes per version.

name: Smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.read.outputs.tags }}
      next-tag: ${{ steps.read.outputs.next-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the supported server range from info.xml
        id: read
        run: |
          # 404 means the tag does not exist. Anything else — Docker Hub rate-limiting
          # the shared runner IPs, a timeout, a 5xx — is a broken answer, not an
          # absent image, and must not be read as one: that would either skip a
          # version the app promises or fail the range on a network hiccup.
          has_image() {
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' \
              "https://hub.docker.com/v2/repositories/library/nextcloud/tags/$1")
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::Docker Hub answered $code for $1, so whether the image exists is unknown."
                 exit 1 ;;
            esac
          }

          spec=$(grep -oP '<nextcloud[^>]*' appinfo/info.xml)
          min=$(printf '%s' "$spec" | grep -oP 'min-version="\K[0-9]+')
          max=$(printf '%s' "$spec" | grep -oP 'max-version="\K[0-9]+')

          # Every version in the declared range, not only its ends: a range of three
          # would otherwise leave the middle one — usually the most widely installed
          # server — untested.
          #
          # A declared version without an official image cannot be tested here. That
          # happens while the app already supports a server that Docker Hub has not
          # published yet, which is a deliberate state: the version was then verified
          # by hand instead. The image appears on release day and the gate closes
          # again by itself, so this weakens nothing for any released server. The
          # oldest declared version is the exception — no image there means the range
          # itself is wrong.
          tags=""
          for v in $(seq "$min" "$max"); do
            if has_image "$v-apache"; then
              tags="${tags:+$tags, }\"$v-apache\""
            elif [ "$v" = "$min" ]; then
              echo "::error::Nextcloud $min is the oldest version the app declares, and there is no $min-apache image."
              exit 1
            else
              echo "::warning::No image for Nextcloud $v yet, so the smoke test skips it. Verify that version by hand until the image is published."
            fi
          done

          # The server after the declared range, if the official image already has
          # it. Nextcloud publishes a tag when a version is released, so this stays
          # empty for most of a cycle and starts testing the moment it is not — no
          # edit needed here when 35, then 36, then 37 appears. Nothing depends on
          # it: the run is allowed to fail, see continue-on-error below.
          next=$((max + 1))
          if has_image "$next-apache"; then
            echo "next-tag=$next-apache" >> "$GITHUB_OUTPUT"
            tags="$tags, \"$next-apache\""
            echo "the next server already has an image: $next-apache"
          else
            echo "next-tag=" >> "$GITHUB_OUTPUT"
            echo "no image for Nextcloud $next yet"
          fi

          echo "tags=[$tags]" >> "$GITHUB_OUTPUT"
          echo "testing against: [$tags]"

  smoke:
    needs: versions
    runs-on: ubuntu-latest
    # The declared versions are a gate. The one after them is an early warning and
    # must never block a merge — the app does not claim to support it yet.
    continue-on-error: ${{ matrix.tag == needs.versions.outputs.next-tag }}
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.versions.outputs.tags) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: gd, zip
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The package must be built the way it is shipped, otherwise the test proves
      # something else. krankerl packages the committed state and applies
      # .nextcloudignore; rebuilding that logic here would be a second source of truth.
      # Pinned on purpose: a build tool that moves on its own can change what gets
      # packaged without anyone deciding it. Bump deliberately.
      # Worth adding once someone has checked it: a sha256 next to the download.
      - name: Install krankerl
        env:
          KRANKERL_VERSION: v0.14.0
        run: |
          # -f is essential: without it an HTTP error page is written into the file,
          # `install` makes it executable, and the failure only surfaces later as a
          # confusing exec-format error.
          curl -fsSL -o krankerl \
            "https://github.com/ChristophWurst/krankerl/releases/download/$KRANKERL_VERSION/krankerl"
          sudo install -m 755 krankerl /usr/local/bin/krankerl
          krankerl --version

      - name: Build the package
        run: krankerl package

      # SLOW is not set here on purpose: waiting for the resend cooldown is the
      # script's default, and repeating it would just be a second place to forget.
      - name: Smoke test on Nextcloud ${{ matrix.tag }}
        env:
          NC_TAG: ${{ matrix.tag }}
        run: tests/smoke/smoke.sh

      # No log-dumping step here on purpose: smoke.sh tears the containers down at the
      # end of each version, so a following step would find nothing to read — and it
      # would need NC_TAG/APP_DIR again, which do not carry over between steps. The
      # script therefore dumps the log itself, while the containers still exist.
