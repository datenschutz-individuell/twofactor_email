name: Test

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      # full-matrix, not matrix: the latter gives one PHP per server, which was
      # always the highest. The range in info.xml promises every version in it,
      # and only running the tests proves the promise — php-lint merely parses
      # and psalm never executes. Eight jobs of about a minute, run in parallel.
      matrix: ${{ steps.versions.outputs.full-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version matrix from appinfo/info.xml
        id: versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2
        with:
          matrix: '{"db": ["sqlite"]}'

  unit-tests:
    runs-on: ubuntu-latest
    needs: versions

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    name: Nextcloud ${{ matrix.server-versions }} php${{ matrix.php-versions }} unit tests
    steps:
      - name: Set up php${{ matrix.php-versions }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ctype,curl,dom,gd,iconv,intl,json,mbstring,openssl,posix,sqlite,xml,zip
          coverage: xdebug

      - name: Checkout Nextcloud
        run: git clone https://github.com/nextcloud/server.git --recursive --depth 1 -b ${{ matrix.server-versions }} nextcloud

      - name: Install Nextcloud
        run: php -f nextcloud/occ maintenance:install --database-host 127.0.0.1 --database-name nextcloud --database-user nextcloud --database-pass nextcloud --admin-user admin --admin-pass admin --database ${{ matrix.db }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nextcloud/apps/twofactor_email
          persist-credentials: false

      - name: Install dependencies
        working-directory: nextcloud/apps/twofactor_email
        run: composer install

      - name: Run tests
        working-directory: nextcloud/apps/twofactor_email
        run: composer run test:unit

      # Coverage is a report, not a gate: a failed upload says something about
      # codecov or the runner's location, never about the code under test. It used
      # to fail the whole matrix job — once for a documentation-only pull request,
      # when codecov's storage refused the upload from that runner. A pull request
      # from a fork has no token and would fail the same way.
      - name: Report coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./nextcloud/apps/twofactor_email/tests/clover.xml
          flags: unittests
          fail_ci_if_error: false
